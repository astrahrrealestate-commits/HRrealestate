[project]
name = "estateos"
version = "0.1.0"
description = "EstateOS Phase 1 — AI property-management assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "dbos>=1.0",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "phonenumbers>=8.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "sentry-sdk[fastapi]>=2.19",
    "sqlalchemy>=2.0.36",
    "structlog>=24.4",
    "uuid-utils>=0.10",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "hypothesis>=6.120",
    "httpx>=0.28",
    "import-linter>=2.1",
    "mypy>=1.13",
    "pip-audit>=2.7",
    "polyfactory>=2.18",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-socket>=0.7",
    "pytest-xdist>=3.6",
    "respx>=0.21",
    "ruff>=0.8",
    "syrupy>=4.8",
    "testcontainers[postgres]>=4.9",
    "pytest-timeout>=2.3",
]

[tool.uv]
package = false

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["app/db/alembic/versions", ".claude", "docs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "DTZ", "T20", "PGH", "SIM", "RUF", "ASYNC", "C4", "PT", "N", "ERA"]
ignore = ["RUF001", "RUF002", "RUF003"]  # German text (ß, umlauts) in strings/comments is legitimate

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "PT011"]
"app/db/alembic/**" = ["ERA001"]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["sqlalchemy.orm.declared_attr", "declared_attr"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests", "evals"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
mypy_path = "."
explicit_package_bases = true
exclude = ["app/db/alembic/versions/"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "phonenumbers.*", "polyfactory.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--disable-socket --allow-unix-socket --allow-hosts=127.0.0.1,localhost,::1 --strict-markers -p no:cacheprovider"
markers = ["integration: needs Docker (testcontainers Postgres) and/or DBOS"]
timeout = 120  # a hung test fails loudly instead of blocking a gate (DBOS get_result has no timeout)
timeout_method = "thread"
filterwarnings = [
    "error::DeprecationWarning:app.*",
    # starlette TestClient wants `httpx2`; adding it awaits user approval — tracked in docs/PROGRESS.md (M1).
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/db/alembic/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]

# ---------------------------------------------------------------- import-linter (ADR 0004)
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Layered architecture (docs/hld.md §3)"
type = "layers"
layers = [
    "app.main | app.worker",
    "app.api",
    "app.workflows",
    "app.pipeline | app.owner | app.ingestion | app.directory | app.outcomes | app.sender",
    "app.db : app.llm : app.storage : app.channels",
    "app.contracts",
    "app.core",
]

[[tool.importlinter.contracts]]
name = "Send isolation: only app.sender touches outbound adapters and send credentials"
type = "forbidden"
source_modules = [
    "app.main", "app.worker", "app.api", "app.workflows", "app.pipeline", "app.owner", "app.ingestion",
    "app.directory", "app.outcomes", "app.db", "app.llm", "app.storage", "app.contracts", "app.core",
    "app.channels.whatsapp.inbound", "app.channels.gmail.inbound",
]
forbidden_modules = ["app.channels.whatsapp.outbound", "app.channels.gmail.outbound", "app.sender.settings"]

[[tool.importlinter.contracts]]
name = "Rules engine is pure (no I/O layers)"
type = "forbidden"
source_modules = ["app.pipeline.rules"]
forbidden_modules = ["app.db", "app.llm", "app.channels", "app.storage"]
