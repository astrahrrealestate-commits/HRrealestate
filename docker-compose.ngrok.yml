# Standalone ngrok service configuration for EstateOS
# Tunnels frontend on port 3000

services:
  ngrok:
    image: ngrok/ngrok:latest
    container_name: estateos-ngrok
    restart: unless-stopped
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command:
      - "http"
      - "host.docker.internal:3000"
      - "--domain=amusing-clothes-devotee.ngrok-free.dev"
      - "--log=stdout"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:4040:4040"  # Ngrok web inspector: http://localhost:4040

