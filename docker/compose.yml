# Dev stack: `make up` / `make smoke` / `make down`. Prod (Phase 1) uses the same image on one EU VM.
name: estateos

x-app: &app
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: estateos:dev
  volumes:
    - appdata:/app/.data  # local storage, fake mailboxes/media, dev keys: simulator, api and worker share it
    - ../app:/app/app:ro  # live code mount for hot development
    - ../.env:/app/.env:ro
    - ${ESTATEOS_SECRETS_DIR:-C:/Users/ASUS/.estateos}:/secrets:ro  # Google token files
  env_file:
    - ../.env
  environment: &app-env
    ENV: dev
    DATABASE_URL: postgresql+psycopg://estateos:estateos@postgres:5432/estateos
    GMAIL_CREDENTIALS_FILE: /secrets/gmail-read.json
    GMAIL_SEND_CREDENTIALS_FILE: /secrets/gmail-compose.json
    GMAIL_REPLY_SEND_CREDENTIALS_FILE: /secrets/gmail-reply-send.json
    DRIVE_CREDENTIALS_FILE: /secrets/drive-file.json
    # Dashboard API (dev stack only: the default secret is public, prod refuses the fake provider)
    DASHBOARD_AUTH_PROVIDER: ${DASHBOARD_AUTH_PROVIDER:-fake}
    DASHBOARD_SESSION_SECRET: ${DASHBOARD_SESSION_SECRET:-dev-only-session-secret-change-me-32-chars}
    DASHBOARD_TRUST_FORWARDED_FOR: ${DASHBOARD_TRUST_FORWARDED_FOR:-false}
    DASHBOARD_SESSION_TTL_MIN: ${DASHBOARD_SESSION_TTL_MIN:-480}
    DASHBOARD_CORS_ORIGINS: ${DASHBOARD_CORS_ORIGINS:-}
    GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
    # Send mode and Super Agent limits
    TENANT_SENDS_PER_HOUR: ${TENANT_SENDS_PER_HOUR:-30}
    CONCIERGE_DAILY_CAP: ${CONCIERGE_DAILY_CAP:-}
    CONCIERGE_DAILY_BUDGET_USD: ${CONCIERGE_DAILY_BUDGET_USD:-}

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16
    environment:
      POSTGRES_USER: estateos
      POSTGRES_PASSWORD: estateos
      POSTGRES_DB: estateos
    ports: ["127.0.0.1:5433:5432"]  # loopback only: dev credentials
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estateos -d estateos"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}

  api:
    <<: *app
    env_file:
      - ../.env
    command: ["uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12

  worker:
    <<: *app
    env_file:
      - ../.env
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *app-env
      DBOS__VMID: worker-0  # exactly one worker in Phase 1; each replica needs a unique stable id (ADR 0001)
    stop_grace_period: 40s  # > DBOS.destroy(workflow_completion_timeout_sec=20) drain
    deploy:
      replicas: 1
    depends_on:
      migrate: {condition: service_completed_successfully}

volumes:
  pgdata:
  appdata:
