# Installed by `make setup`. Bypassing hooks is blocked for Claude by the bash guard.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
        exclude: /__snapshots__/   # syrupy-generated; exact bytes matter
      - id: trailing-whitespace
        exclude: /__snapshots__/
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
        exclude: ^\.claude/hooks/   # guard self-tests contain fake key headers on purpose
      - id: no-commit-to-branch   # work on m<n>-<slug> branches; merge via PR
        args: [--branch, main]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.5   # keep equal to [tool.uv] required-version, CI setup-uv and docker uv stage
    hooks:
      - id: uv-lock
        args: [--project, backend]
        files: ^backend/(uv\.lock|pyproject\.toml)$
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, feat, fix, chore, docs, refactor, test, perf, ci, build]
  - repo: local
    hooks:
      - id: harness-selftest
        name: claude harness self-test
        entry: python3 -m unittest discover -s .claude/hooks/tests -q
        language: system
        pass_filenames: false
        files: ^\.claude/hooks/
      - id: ruff-check
        name: ruff check
        entry: bash -c 'cd backend && exec uv run --frozen ruff check --fix --force-exclude .'
        language: system
        pass_filenames: false
        types: [python]
        files: ^backend/
      - id: ruff-format
        name: ruff format
        entry: bash -c 'cd backend && exec uv run --frozen ruff format --force-exclude .'
        language: system
        pass_filenames: false
        types: [python]
        files: ^backend/
      - id: import-linter
        name: import-linter (architecture boundaries)
        entry: bash -c 'cd backend && exec uv run --frozen lint-imports'
        language: system
        pass_filenames: false
        types: [python]
        files: ^backend/
      - id: mypy
        name: mypy
        entry: bash -c 'cd backend && exec uv run --frozen mypy app'
        language: system
        pass_filenames: false
        types: [python]
        files: ^backend/
      - id: unit-tests
        name: unit tests
        entry: bash -c 'cd backend && exec uv run --frozen pytest tests/unit tests/contract -q -x -n auto'
        language: system
        pass_filenames: false
        types: [python]
        files: ^backend/
