version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /backend/docker
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /backend/docker
    schedule:
      interval: weekly
