name: dependency-review

# Fails a pull request that adds a dependency with a known high or critical vulnerability. Needs the dependency graph
# (and GitHub Advanced Security on a private repo), so it stays skipped until the repository variable GHAS_ENABLED is
# "true". `make audit` (pip-audit) in ci.yml covers the Python lockfile in the meantime.

on:
  pull_request:
    branches: [main, stage, dev]

permissions:
  contents: read

jobs:
  review:
    name: Dependency review
    if: ${{ !github.event.repository.private || vars.GHAS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec  # v5.0.1
        with:
          fail-on-severity: high
