name: codeql

# Static security analysis (Python + the Next.js frontend). CodeQL needs GitHub Advanced Security on a private repo,
# so the job stays skipped until the repository variable GHAS_ENABLED is set to "true" (Settings > Variables).
# It is deliberately not part of ci-success: findings land in the Security tab and do not block a merge by themselves.

on:
  push:
    branches: [main, stage, dev]
  pull_request:
    branches: [main, stage, dev]
  schedule:
    - cron: "17 3 * * 1"  # weekly, Monday 03:17 UTC

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    if: ${{ !github.event.repository.private || vars.GHAS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934  # v4.39.5
        with:
          category: /language:${{ matrix.language }}
