name: ci

on:
  push:
    branches: [main, "m*-*"]  # main: verifies merge results and seeds caches for new branches
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_FROZEN: "1"
  UV_VERSION: "0.12.5"  # keep equal to [tool.uv] required-version, pre-commit uv-pre-commit and docker uv stage
  PYTHON_VERSION: "3.12"

# Actions are SHA-pinned (Dependabot github-actions updates them); the tag is in the trailing comment.
jobs:
  quality:
    name: G1 lint · types · boundaries · unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync
      - run: make quick
      - name: Harness self-test
        run: make harness-test

  integration:
    name: G2 integration + coverage (testcontainers Postgres + DBOS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync
      - name: Pre-pull test images (keeps pulls out of pytest-timeout)
        run: docker pull postgres:16-alpine && docker pull testcontainers/ryuk:0.8.1
      - name: All tests with coverage floor (unit + integration)
        run: make cov

  security:
    name: Security (pip-audit · gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync
      - run: make audit
      - name: gitleaks (same version as pre-commit; full history; no token needed)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.0 git /repo --redact --verbose

  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: estateos:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
