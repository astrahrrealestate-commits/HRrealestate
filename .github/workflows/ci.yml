name: ci

on:
  push:
    branches: [main, "m*-*"]  # main: verifies merge results and seeds caches for new branches
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_FROZEN: "1"
  UV_VERSION: "0.12.5"  # keep equal to [tool.uv] required-version, pre-commit uv-pre-commit and docker uv stage
  PYTHON_VERSION: "3.12"

# Actions are SHA-pinned (Dependabot github-actions updates them); the tag is in the trailing comment.
jobs:
  quality:
    name: G1 lint · types · boundaries · unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync
      - run: make quick
      - name: Harness self-test
        run: make harness-test

  integration:
    name: G2 integration + coverage (testcontainers Postgres + DBOS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync
      - name: Pre-pull test images (keeps pulls out of pytest-timeout)
        run: docker pull postgres:16-alpine && docker pull testcontainers/ryuk:0.8.1
      - name: All tests with coverage floor (unit + integration)
        run: make cov

  security:
    name: Security (pip-audit · gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync
      - run: make audit
      - name: gitleaks (same version as pre-commit; full history; no token needed)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.0 git /repo --redact --verbose

  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: estateos:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend:
    name: Frontend typecheck · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      # Advisory until the existing backlog clears (87 errors, 178 warnings on 2026-11-08); then drop continue-on-error.
      - name: ESLint (advisory)
        run: npm run lint
        continue-on-error: true

  # The one required check for branch protection: green only when every job above is green (a skipped or cancelled
  # job fails it, so a job can never be quietly dropped from the gate).
  ci-success:
    name: ci-success
    if: always()
    needs: [quality, integration, security, image, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job must have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::a required job finished as '$result'"
              exit 1
            fi
          done
