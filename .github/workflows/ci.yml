name: ci

on:
  push:
    # main/stage/dev: verifies merge/promotion results and seeds caches.
    branches: [main, stage, dev]
  pull_request:
    branches: [main, stage, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_FROZEN: "1"
  UV_VERSION: "0.12.5"  # keep equal to [tool.uv] required-version, pre-commit uv-pre-commit and docker uv stage
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"  # keep equal to the node stage in docker/web.Dockerfile

# Actions are SHA-pinned (Dependabot github-actions updates them); the tag is in the trailing comment.
jobs:
  quality:
    name: G1 lint · types · boundaries · unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --project backend
      - run: make quick
      - name: Harness self-test
        run: make harness-test

  integration:
    name: G2 integration + coverage (testcontainers Postgres + DBOS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --project backend
      - name: Pre-pull test images (keeps pulls out of pytest-timeout)
        # Same images as backend/tests/integration/conftest.py and testcontainers' ryuk default (tests/unit/infra checks both)
        run: docker pull pgvector/pgvector:0.8.2-pg16 && docker pull testcontainers/ryuk:0.8.1
      - name: All tests with coverage floor (unit + integration)
        run: make cov

  security:
    name: Security (pip-audit · gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --project backend
      - run: make audit
      - name: gitleaks (same version as pre-commit; full history; no token needed)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.0 git /repo --redact --verbose

  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: backend
          file: backend/docker/Dockerfile
          push: false
          load: true  # into the runner's docker for the CVE scan below
          tags: estateos:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image CVE scan (Trivy; fails on HIGH/CRITICAL CVEs that have a fix, unfixed ones are listed only)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress estateos:ci

  frontend:
    name: Frontend typecheck · lint · build (Next.js dashboard)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
        # Advisory: the dashboard has 87 existing eslint errors (2026-11-08). Drop this line once `npm run lint` is
        # clean so lint becomes a gate like the typecheck and build around it.
        continue-on-error: true
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://ci.estateos.invalid  # baked into the bundle; the prod build uses the real origin

  # The one required check for branch protection: green only when every job above is green (a skipped or cancelled
  # job fails it, so a job can never be quietly dropped from the gate).
  ci-success:
    name: ci-success
    if: always()
    needs: [quality, integration, security, image, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job must have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::a required job finished as '$result'"
              exit 1
            fi
          done
