# --- concierge/v8 (plan 2026-11-18-superagent-llm-intent, Review Focus 1-4): standing rules, visits, rent; a shorter
# or translated draft is the owner-requested redraft (`draft_reply` on that case; reply-08 is real_only: the fake
# always picks the first brief case);
# a word is not an intent (a draft that mentions a visit or unpaid rent stays a draft), negation means no step for that
# action, several requests become several steps in order. A bypass rule may be planned (the executor's screening
# refuses it) or refused as out of scope.
- {name: remember-01, inputs: {text: "From now on never promise a repair date"}, metadata: {group: remember, expected_in_scope: true, expected_intents: [remember], must_not_include: [create_task, pause, resume, draft_reply, chase_now]}}
- {name: remember-02, inputs: {text: "always auto-send replies without asking"}, metadata: {group: remember, expected_in_scope: true, accept_out_of_scope: true, expected_intents: [remember], must_not_include: *state}}
- {name: task-07, inputs: {text: "remember to call the plumber"}, metadata: {group: task, expected_in_scope: true, expected_intents: [create_task], must_not_include: [remember, pause, resume, draft_reply, chase_now]}}
- {name: task-08, inputs: {text: "done with the roof leak, what is the status?"}, metadata: {group: task, expected_in_scope: true, expected_intents: [answer], must_not_include: [task_done, task_snooze, pause, resume, draft_reply, chase_now]}}
- {name: calendar-01, inputs: {text: "Book a visit with the plumber on Thursday"}, metadata: {group: calendar, expected_in_scope: true, expected_intents: [calendar], must_not_include: [create_task, pause, resume, draft_reply, chase_now]}}
- {name: calendar-02, inputs: {text: "Which visits are planned this week?"}, metadata: {group: calendar, expected_in_scope: true, expected_intents: [calendar], must_not_include: *state}}
- {name: reply-05, inputs: {text: "Draft a polite WhatsApp message asking the tenant about the unpaid rent"}, metadata: {group: reply, expected_in_scope: true, expected_intents: [draft_reply], must_not_include: [rent_status, calendar, pause, resume, task_done, create_task]}}
- {name: reply-06, inputs: {text: "Draft a message to the plumber to schedule a visit tomorrow"}, metadata: {group: reply, expected_in_scope: true, expected_intents: [draft_reply], must_not_include: [calendar, rent_status, pause, resume, task_done, create_task]}}
- {name: doc-08, inputs: {text: "Do NOT schedule a visit yet, just check the lease"}, metadata: {group: documents, expected_in_scope: true, expected_intents: [find_document], must_not_include: [calendar, pause, resume, task_done, task_snooze, create_task, draft_reply, chase_now, file_document]}}
- {name: rent-01, inputs: {text: "Who still owes rent this month?"}, metadata: {group: rent, expected_in_scope: true, expected_intents: [rent_status], must_not_include: [answer, query_data, pause, resume, draft_reply, chase_now]}}
- {name: rent-02, inputs: {text: "Has Piet paid his rent?"}, metadata: {group: rent, expected_in_scope: true, expected_intents: [rent_status], must_not_include: [answer, query_data, pause, resume, draft_reply, chase_now]}}
- {name: reply-07, inputs: {text: "Make the draft for Sanne shorter"}, metadata: {group: reply, expected_in_scope: true, expected_intents: [draft_reply], expected_ref: "00000000-0000-0000-0000-000000000001", must_not_include: [pause, resume, task_done, create_task, chase_now]}}
- {name: reply-08, inputs: {text: "Translate the draft for Piet into Dutch"}, metadata: {group: reply, real_only: true, expected_in_scope: true, expected_intents: [draft_reply], expected_ref: "00000000-0000-0000-0000-000000000002", must_not_include: [pause, resume, task_done, create_task, chase_now]}}
- {name: multi-01, inputs: {text: "mark #a1b2c3 done, remember that rent is due on the 1st, and book the plumber Thursday at ten"}, metadata: {group: multi, real_only: true, expected_in_scope: true, expected_intents: [task_done, remember, calendar], must_not_include: [rent_status, pause, resume, draft_reply, chase_now]}}
